apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-lab-data
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: storage-lab
  template:
    metadata:
      labels:
        app: storage-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: storage-lab:1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage-lab-data
---
apiVersion: v1
kind: Service
metadata:
  name: storage-lab
spec:
  selector:
    app: storage-lab
  ports:
    - port: 8000
      targetPort: 8000
