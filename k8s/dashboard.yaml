# Select a worker-local directory on the runner, independent of experiment PVCs.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-results-local
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: lab-local
  local:
    path: /var/lib/storage-lab-results
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker-1]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-results
spec:
  storageClassName: lab-local
  volumeName: storage-results-local
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: storage-dashboard
  template:
    metadata:
      labels:
        app: storage-dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: dashboard
          image: storage-lab:1.1
          imagePullPolicy: IfNotPresent
          command: [python, -m, uvicorn, dashboard:app, --host, "0.0.0.0", --port, "8080"]
          env:
            - {name: STORAGE_URL, value: "http://storage-lab:8000"}
            - {name: BACKEND_LABEL, value: "Longhorn"}
            - {name: RESULTS_DB, value: "/results/runs.sqlite3"}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            tcpSocket:
              port: 8080
          volumeMounts:
            - {name: results, mountPath: /results}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: storage-results
